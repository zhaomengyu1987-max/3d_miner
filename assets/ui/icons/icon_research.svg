<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<defs>
    <filter id="g1" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="g2" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26374a"/><stop offset="100%" stop-color="#0c141d"/>
    </linearGradient>
    <radialGradient id="engG">
      <stop offset="0%" stop-color="#d8f6ff"/><stop offset="45%" stop-color="#58a7bf" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#58a7bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgR" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#121d29"/><stop offset="100%" stop-color="#070a0f"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9a8"/><stop offset="100%" stop-color="#e0b34c"/>
    </linearGradient>
    <linearGradient id="laser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b8"/><stop offset="100%" stop-color="#f39058" stop-opacity=".1"/>
    </linearGradient>
  </defs>
<rect width="128" height="128" rx="8" fill="url(#bgR)"/> <!-- 基座芯片 --> <rect x="30" y="78" width="68" height="30" rx="4" fill="url(#hull)" stroke="#58a7bf" stroke-width="2.5" filter="url(#g1)"/> <rect x="44" y="86" width="40" height="14" rx="2" fill="#0a0f14" stroke="#305665" stroke-width="1.4"/> <path d="M50,90 h28 M50,96 h28" stroke="#3d5a70" stroke-width="1"/> <!-- 芯片引脚 --> <path d="M36,108 v6 M48,108 v6 M60,108 v6 M72,108 v6 M84,108 v6 M96,108 v6 M36,78 v-6 M52,78 v-6 M68,78 v-6 M84,78 v-6" stroke="#305665" stroke-width="2"/> <!-- 雷达碟 --> <path d="M40,40 A24,24 0 0 1 88,40 L88,45 A19,19 0 0 0 40,45 Z" fill="#15222f" stroke="#58a7bf" stroke-width="2.2" filter="url(#g1)"/> <path d="M46,37 A18,18 0 0 1 82,37" fill="none" stroke="#3d5a70"/> <path d="M64,40 V78" stroke="#58a7bf" stroke-width="2.6"/> <!-- 原子轨道(双环电子) --> <g ><ellipse cx="64" cy="52" rx="30" ry="10" fill="none" stroke="#4cc8e0" stroke-width="1.6" opacity=".8" transform="rotate(18 64 52)"/> <circle cx="92" cy="46" r="2.6" fill="#a8ecfa" filter="url(#g1)"/></g> <g ><ellipse cx="64" cy="52" rx="24" ry="8" fill="none" stroke="#4cc8e0" stroke-width="1.3" opacity=".6" transform="rotate(-24 64 52)"/> <circle cx="42" cy="58" r="2.2" fill="#a8ecfa"/></g> <circle cx="64" cy="52" r="5" fill="#58a7bf" opacity=".9" filter="url(#g1)" />
</svg>
