<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<defs>
    <filter id="g1" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="g2" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26374a"/><stop offset="100%" stop-color="#0c141d"/>
    </linearGradient>
    <radialGradient id="engG">
      <stop offset="0%" stop-color="#d8f6ff"/><stop offset="45%" stop-color="#58a7bf" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#58a7bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgR" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#121d29"/><stop offset="100%" stop-color="#070a0f"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9a8"/><stop offset="100%" stop-color="#e0b34c"/>
    </linearGradient>
    <linearGradient id="laser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b8"/><stop offset="100%" stop-color="#f39058" stop-opacity=".1"/>
    </linearGradient>
  </defs>
<rect width="128" height="128" rx="8" fill="url(#bgR)"/> <!-- 机体 --> <path d="M52,44 h24 l6,10 v10 l-6,6 h-24 l-6,-6 v-10 Z" fill="url(#hull)" stroke="#58a7bf" stroke-width="2.4" filter="url(#g1)"/> <circle cx="64" cy="54" r="4" fill="#0a0f14" stroke="#58a7bf" stroke-width="1.6"/> <circle cx="64" cy="54" r="1.6" fill="#58a7bf" /> <!-- 旋翼臂+旋翼(频闪) --> <path d="M52,50 L34,40 M76,50 L94,40" stroke="#305665" stroke-width="3"/> <g stroke="#4cc8e0" stroke-width="2" filter="url(#g1)"> <ellipse cx="30" cy="36" rx="14" ry="2.6" fill="none"/> </g> <g stroke="#4cc8e0" stroke-width="2" filter="url(#g1)" style="animation-delay:.09s"> <ellipse cx="98" cy="36" rx="14" ry="2.6" fill="none"/> </g> <!-- 牵引光束(锥形渐变) --> <path d="M58,70 L50,102 L78,102 L70,70 Z" fill="url(#laser)" opacity=".7"/> <path d="M64,70 V102" stroke="#ffd9b8" stroke-width="1.4" filter="url(#g1)"/> <!-- 抓爪 --> <path d="M56,70 v10 l-5,6 M72,70 v10 l5,6" stroke="#58a7bf" stroke-width="2" fill="none"/> <!-- 小矿石(被抓起) --> <path d="M60,104 l5,-5 6,3 1,6 -6,4 -5,-3 Z" fill="#15222f" stroke="#e0b34c" stroke-width="1.6"/> <circle cx="63.5" cy="106" r="1.4" fill="#ffe9a8" />
</svg>
