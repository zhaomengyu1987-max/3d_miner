<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<defs>
    <filter id="g1" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="g2" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26374a"/><stop offset="100%" stop-color="#0c141d"/>
    </linearGradient>
    <radialGradient id="engG">
      <stop offset="0%" stop-color="#d8f6ff"/><stop offset="45%" stop-color="#58a7bf" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#58a7bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgR" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#121d29"/><stop offset="100%" stop-color="#070a0f"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9a8"/><stop offset="100%" stop-color="#e0b34c"/>
    </linearGradient>
    <linearGradient id="laser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b8"/><stop offset="100%" stop-color="#f39058" stop-opacity=".1"/>
    </linearGradient>
  </defs>
<rect width="128" height="128" rx="8" fill="url(#bgR)"/> <!-- 中央信用币 --> <circle cx="64" cy="64" r="24" fill="url(#hull)" stroke="#58a7bf" stroke-width="2.6" filter="url(#g1)"/> <circle cx="64" cy="64" r="18" fill="none" stroke="#305665" stroke-width="1.4"/> <path d="M64,50 v28 M58,50 h12 M58,78 h12 M58,64 h10 a4,4 0 0 1 0,8 h-10" fill="none" stroke="#58a7bf" stroke-width="2.4" stroke-linecap="round"/> <!-- 买入弧(左下→右上) --> <path d="M22,92 Q44,104 66,92" fill="none" stroke="#73e68d" stroke-width="2.6" stroke-linecap="round" filter="url(#g1)"/> <path d="M62,88 L68,92 L62,96" fill="none" stroke="#73e68d" stroke-width="2.6" stroke-linecap="round"/> <circle cx="22" cy="92" r="3" fill="#73e68d" /> <!-- 卖出弧(右上→左下) --> <path d="M106,36 Q84,24 62,36" fill="none" stroke="#f39058" stroke-width="2.6" stroke-linecap="round" filter="url(#g1)"/> <path d="M66,32 L60,36 L66,40" fill="none" stroke="#f39058" stroke-width="2.6" stroke-linecap="round"/> <circle cx="106" cy="36" r="3" fill="#f39058" /> <!-- 数据 tick --> <path d="M28,40 h8 l4,-8 l6,16 l5,-8 h9" fill="none" stroke="#4cc8e0" stroke-width="1.6" opacity=".8"/> <path d="M70,98 h8 l4,6 l6,-12 l5,6 h7" fill="none" stroke="#4cc8e0" stroke-width="1.6" opacity=".8"/>
</svg>
